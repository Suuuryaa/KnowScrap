name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install Node.js dependencies
        run: cd src/knowscraper/anti_detection/node_service && npm install

      - name: Run tests (excluding live network tests)
        run: pytest tests/ -m "not integration" -q
