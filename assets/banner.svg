<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bg)" rx="12"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="4" height="160" fill="url(#accent)" rx="2"/>

  <!-- Spider web icon (simple) -->
  <g transform="translate(52, 80)" stroke="url(#accent)" stroke-width="1.2" fill="none" opacity="0.9">
    <!-- web rings -->
    <circle cx="0" cy="0" r="10"/>
    <circle cx="0" cy="0" r="20"/>
    <circle cx="0" cy="0" r="30"/>
    <!-- web spokes -->
    <line x1="0" y1="-30" x2="0" y2="30"/>
    <line x1="-30" y1="0" x2="30" y2="0"/>
    <line x1="-21" y1="-21" x2="21" y2="21"/>
    <line x1="21" y1="-21" x2="-21" y2="21"/>
    <!-- spider dot -->
    <circle cx="0" cy="0" r="3" fill="url(#accent)" stroke="none"/>
  </g>

  <!-- Main title -->
  <text x="105" y="72" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="46" font-weight="700" fill="white" letter-spacing="-1">
    KnowScraper
  </text>

  <!-- Gradient underline -->
  <rect x="105" y="82" width="340" height="2.5" fill="url(#accent)" rx="2"/>

  <!-- Tagline -->
  <text x="106" y="112" font-family="'SF Pro Text', 'Segoe UI', system-ui, sans-serif"
        font-size="15" fill="#94a3b8" letter-spacing="0.3">
    Reliable web scraping for Python · Anti-bot evasion · Browser automation · AI extraction
  </text>

  <!-- Right side pills -->
  <g transform="translate(680, 52)">
    <!-- Python pill -->
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#1e293b"/>
    <text x="40" y="17" font-family="system-ui" font-size="12" fill="#6366f1"
          text-anchor="middle" font-weight="600">Python 3.10+</text>

    <!-- Node pill -->
    <rect x="88" y="0" width="80" height="26" rx="13" fill="#1e293b"/>
    <text x="128" y="17" font-family="system-ui" font-size="12" fill="#06b6d4"
          text-anchor="middle" font-weight="600">Node.js 18+</text>

    <!-- MIT pill -->
    <rect x="44" y="34" width="80" height="26" rx="13" fill="#1e293b"/>
    <text x="84" y="51" font-family="system-ui" font-size="12" fill="#22c55e"
          text-anchor="middle" font-weight="600">MIT License</text>
  </g>
</svg>
